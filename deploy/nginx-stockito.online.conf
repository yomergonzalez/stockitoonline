server {
    listen 80;
    listen [::]:80;
    server_name stockito.online www.stockito.online;

    root /var/www/stockito.online;
    index index.html;

    # SPA: serve index.html for any client-side route
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite hashes asset filenames -> safe to cache hard
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
